[package]
name = "second-brain"
description = "second-brain: a personal knowledge base for AI agents"
readme = "README.md"
keywords = ["knowledge-base", "cli", "slack", "llm", "ai-agents"]
categories = ["command-line-utilities"]
documentation = "https://github.com/a-miyashita/second-brain/tree/main/manuals/en"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "second-brain"

[[bin]]
name = "second-brain"
path = "src/main.rs"

[[bin]]
name = "sb"
path = "src/bin/sb.rs"

[dependencies]
second-brain-kernel.workspace = true
second-brain-store.workspace = true
second-brain-pipeline.workspace = true
second-brain-llm.workspace = true
second-brain-google.workspace = true
second-brain-slack.workspace = true
second-brain-setup.workspace = true
second-brain-ondemand.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
fs4.workspace = true
open.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
