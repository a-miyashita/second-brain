[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/a-miyashita/second-brain"
authors = ["MIYASHITA, Akihiro"]

[workspace.dependencies]
second-brain-kernel = { path = "crates/sb-kernel", version = "=0.1.0" }
second-brain-store = { path = "crates/sb-store", version = "=0.1.0" }
second-brain-pipeline = { path = "crates/sb-pipeline", version = "=0.1.0" }
second-brain-llm = { path = "crates/sb-llm", version = "=0.1.0" }
second-brain-google = { path = "crates/sb-google", version = "=0.1.0" }
second-brain-slack = { path = "crates/sb-slack", version = "=0.1.0" }
second-brain-setup = { path = "crates/sb-setup", version = "=0.1.0" }
second-brain-extract = { path = "crates/sb-extract", version = "=0.1.0" }
second-brain-ondemand = { path = "crates/sb-ondemand", version = "=0.1.0" }

anyhow = "1"
calamine = { version = "0.36", default-features = false, features = ["dates"] }
chardetng = "1"
csv = "1"
ego-tree = "0.11"
encoding_rs = "0.8"
pdf-extract = "0.12"
quick-xml = "0.42"
scraper = "0.27"
zip = { version = "8", default-features = false, features = ["deflate"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
directories = "6"
fs4 = { version = "0.13", features = ["sync"] }
futures = "0.3"
hex = "0.4"
iana-time-zone = "0.1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "gzip", "deflate", "brotli"] }
rpassword = "7"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal", "fs"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ulid = "1"
unicode-normalization = "0.1"
url = "2"
which = "8"
wiremock = "0.6"
open = "5"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
