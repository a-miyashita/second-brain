# Release workflow (ADR-0019, docs/specs/release.md).
#
# A push of a tag vX.Y.Z checks the tag against Cargo.toml and CHANGELOG.md, runs CI,
# waits for the approval of the `release` environment, publishes the crates to
# crates.io, tests `cargo install`, and creates the GitHub Release.
# A manual run only checks and does a publish dry run; it never publishes.
#
# The tag text is never put into a script through ${{ }}; it is passed with `env`.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and origin/main are needed for the checks
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag, the versions and the changelog
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check --tag "$TAG"
      - name: Check the working tree and do a publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/release.mjs check
          node scripts/release.mjs publish --dry-run
      - name: Read the version
        id: info
        run: |
          version="$(node scripts/release.mjs version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  test:
    needs: verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [verify, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment has a required reviewer. The run waits here until they approve.
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to crates.io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get a short-lived crates.io token
        id: auth
        # v1.0.5. Pinned by commit SHA because this action receives the OIDC token.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish the crates that are not on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node scripts/release.mjs publish

  smoke:
    needs: [verify, publish]
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Install from crates.io
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The crates.io index can lag for a few minutes after a publish.
          for attempt in 1 2 3 4 5 6; do
            if cargo install second-brain --version "$VERSION" --locked --root "$RUNNER_TEMP/sb"; then
              exit 0
            fi
            echo "install failed (attempt $attempt); retrying in 30 s"
            sleep 30
          done
          exit 1
      - name: Run the installed programs
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          "$RUNNER_TEMP/sb/bin/sb" version | tee sb-version.txt
          "$RUNNER_TEMP/sb/bin/second-brain" version
          grep -F "second-brain $VERSION " sb-version.txt

  github-release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          node scripts/release.mjs notes "$VERSION" > release-notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md "${flags[@]}"
          fi
